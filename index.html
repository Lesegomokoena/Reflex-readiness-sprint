<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex | Delivery Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth_page">
    <section class="auth_card">
      <div class="brand_mark">REFLEX</div>
      <p class="eyebrow">DELIVERY MANAGEMENT</p>
      <h1>Sign in to Reflex</h1>
      <p class="muted">Use a demo role to explore the three working dashboards.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" value="user@reflex.local" required>

        <label for="password">Password</label>
        <input id="password" type="password" value="password" required>

        <label for="role">Role</label>
        <select id="role" required>
          <option value="retailer">Retailer</option>
          <option value="dispatcher">Dispatcher</option>
          <option value="rider">Rider</option>
        </select>

        <button class="primary_button" type="submit">Sign in</button>
      </form>

      <!-- <div class="demo_note">
        <strong>Demo mode</strong>
        <span>Data is stored in your browser. No backend is required for this prototype.</span>
      </div> -->
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
