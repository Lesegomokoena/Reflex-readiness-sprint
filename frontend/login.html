<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex | Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth_page">
    <div class="auth_split_left">
      <h1>Coordinate deliveries<br>with precision.</h1>
      <p>Sign in to your Reflex dashboard to track assignments, manage dispatches, and confirm delivery statuses in real time.</p>
    </div>
    
    <div class="auth_split_right">
      <section class="auth_card">
        <div class="brand_mark">REFLEX</div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in to Reflex</h1>
        <p class="muted">Enter your credentials below to access your dashboard.</p>
  
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
  
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required>
  
          <button class="primary_button" type="submit">Sign in</button>
        </form>
        
        <div style="margin-top: 24px; text-align: center; font-size: 13px;">
          <span class="muted">Don't have an account?</span>
          <a href="signup.html" style="color: var(--blue); font-weight: 700;">Sign up</a>
        </div>
      </section>
    </div>
  </main>
  
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
