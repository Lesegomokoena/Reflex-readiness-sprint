<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth_page">
    <div class="auth_split_left">
      <h1>Join the fastest growing<br>delivery network.</h1>
      <p>Create an account to start managing your retail deliveries, dispatching riders, or delivering packages with Reflex.</p>
    </div>
    
    <div class="auth_split_right">
      <section class="auth_card">
        <div class="brand_mark">REFLEX</div>
        <p class="eyebrow">GET STARTED</p>
        <h1>Create an Account</h1>
        <p class="muted">Fill out the details below to join the Reflex network.</p>
  
        <form id="signupForm">
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Jane Doe" required>
          
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="jane@example.com" required>
  
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required>

          <label for="role">Account Type</label>
          <select id="role" required>
            <option value="retailer_staff">Retailer</option>
            <option value="dispatcher">Dispatcher</option>
            <option value="rider">Rider</option>
          </select>
  
          <button class="primary_button" type="submit">Create Account</button>
        </form>
        
        <div style="margin-top: 24px; text-align: center; font-size: 13px;">
          <span class="muted">Already have an account?</span>
          <a href="login.html" style="color: var(--blue); font-weight: 700;">Sign in</a>
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
